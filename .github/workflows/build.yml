name: Build

# The APK is only ever built here — there is no Android SDK on the developer's
# laptop — so this workflow is the app's only gate. It has to actually check
# things, not just produce a file.

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_VERSION: '8.11.1'

jobs:
  verify:
    name: Tests & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' }}

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Android lint
        run: gradle lintDebug --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/**
          retention-days: 14
          if-no-files-found: ignore

  debug-apk:
    name: Debug APK
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: true

      - name: Assemble debug
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: chaitanya-stores-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

  release-apk:
    name: Release APK
    runs-on: ubuntu-latest
    needs: verify
    env:
      KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      # A tag is a real release. Producing an unsigned APK from one is never what
      # was meant — Android refuses to install it — so stop here rather than
      # publish something nobody can put on a phone.
      - name: Require signing for tagged releases
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_BASE64 == ''
        run: |
          echo "::error::Tagged release but RELEASE_KEYSTORE_BASE64 is not set. See document.md section 8 for the one-time keystore setup."
          exit 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: true

      # Which secrets the run can actually see. Booleans only — never the
      # values. Without this, a typo'd secret name is indistinguishable from
      # having set nothing at all, and the only symptom is an APK that silently
      # will not install.
      - name: Report signing inputs
        env:
          P: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          A: ${{ secrets.RELEASE_KEY_ALIAS }}
          K: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -u
          report() { [ -n "$2" ] && echo "  $1: present" || echo "  $1: MISSING"; }
          echo "Signing secrets visible to this run:"
          report RELEASE_KEYSTORE_BASE64   "$KEYSTORE_BASE64"
          report RELEASE_KEYSTORE_PASSWORD "$P"
          report RELEASE_KEY_ALIAS         "$A"
          report RELEASE_KEY_PASSWORD      "$K"
          [ -n "$KEYSTORE_BASE64" ] && echo "  base64 length: ${#KEYSTORE_BASE64} chars"
          exit 0

      # Optional on ordinary pushes: with the secrets unset the release build
      # still runs and proves R8 has not stripped anything the app needs. The
      # APK it produces is unsigned and is labelled as such below.
      - name: Restore keystore
        if: env.KEYSTORE_BASE64 != ''
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.keystore

      # Catches a base64 secret that got line-wrapped on paste, and a password
      # that does not match the key. Both otherwise surface much later as an
      # opaque Gradle failure or, worse, a quietly unsigned APK.
      - name: Check the keystore decoded and opens
        if: env.KEYSTORE_BASE64 != ''
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          echo "Decoded keystore: $(wc -c < release.keystore) bytes"
          if ! keytool -list -keystore release.keystore \
                 -storepass "$RELEASE_KEYSTORE_PASSWORD" > keystore-contents.txt 2>&1; then
            echo "::error::Could not open release.keystore. Either RELEASE_KEYSTORE_BASE64 is corrupt (a line break on paste is the usual cause) or RELEASE_KEYSTORE_PASSWORD is wrong."
            sed -e 's/^/  /' keystore-contents.txt
            exit 1
          fi
          echo "Keystore opened. Aliases it contains:"
          grep -i 'PrivateKeyEntry\|trustedCertEntry' keystore-contents.txt | sed -e 's/^/  /'
          rm -f keystore-contents.txt

      - name: Assemble release
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Shred keystore
        if: always()
        run: rm -f release.keystore

      # The decisive check. Everything up to here can look healthy and still
      # yield an APK Android refuses, so confirm the signature on the actual
      # artifact rather than inferring it from the build succeeding.
      - name: Verify the APK is really signed
        if: env.KEYSTORE_BASE64 != ''
        run: |
          set -e
          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error::Expected a signed $apk but Gradle produced:"
            ls -la app/build/outputs/apk/release/
            echo "::error::The signing config did not activate. release.keystore was present, so check RELEASE_KEYSTORE_PASSWORD is non-empty."
            exit 1
          fi
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$apksigner" ]; then
            echo "::warning::apksigner not found on the runner; skipping signature verification."
            exit 0
          fi
          "$apksigner" verify --verbose --print-certs "$apk"
          echo "APK is signed and installable."

      # AGP names the output app-release.apk when signed and
      # app-release-unsigned.apk when not. Naming the artifact after which one
      # actually came out means an uninstallable APK can never again be handed
      # over looking like a finished release.
      - name: Name the artifact for what it is
        id: apk
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "name=chaitanya-stores-release" >> "$GITHUB_OUTPUT"
          else
            echo "name=UNSIGNED-cannot-be-installed" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing secrets set, so this APK is unsigned and Android will reject it with 'invalid package'. Install the debug APK, or set up signing per document.md section 8."
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90
          if-no-files-found: error

  publish:
    name: Attach APK to release
    runs-on: ubuntu-latest
    needs: [ debug-apk, release-apk ]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: chaitanya-stores-release
          path: apk

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: apk/*.apk
          generate_release_notes: true
