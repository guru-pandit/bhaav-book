# Required by Jetpack Compose and Material 3.
android.useAndroidX=true

# Build performance. 4 GB because KSP runs Room and Hilt's processors in the
# same daemon, and 2 GB is where that starts to thrash on CI.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

kotlin.code.style=official

# Only generate R classes for resources this module actually declares.
android.nonTransitiveRClass=true
